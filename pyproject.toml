[project]
name = "content-answer-workspace"
version = "1.0.0"
description = "Content collection and answer generation workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "langgraph>=0.2",
  "openai>=1.93.0",
  "pydantic>=2.11.7",
  "python-dotenv>=1.1.1",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "uvicorn>=0.35.0",
  "playwright>=1.48.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]
