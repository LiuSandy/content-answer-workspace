id: knowledge.query_rewrite
name: query_rewrite
version: "1.1.0"
description: "RAG 查询改写 prompt"
model:
  profile: router
  temperature: 0.0
  max_tokens: 256
variables:
  required:
    - query
messages:
  - role: user
    content: |
      请将用户的问题改写为更适合在知识库中进行全文和向量检索的查询语句，
      提取核心关键词，去除多余语气词，保留原始问题中的关键实体。
      只输出改写后的查询，不要输出任何解释。
      用户问题：{{ query }}
