id: writing.user_rewrite
version: "1.0.0"
description: 用户动态提示词模版 (重写润色)

variables:
  required:
    - title
    - current_answer
    - instruction
  optional:
    - content_mode
    - outline

messages:
  - role: user
    content: |
      {% if content_mode == 'imitate' %}
      请对下面这篇社交平台笔记进行润色改写。要求：保留原有核心创意和结构，不要引入新观点；改善语言表达，消除 AI 腔，让行文更自然简洁，保留原有观点。
      {% else %}
      请对下面这篇社交平台回答进行润色改写。
      {% endif %}
      
      帖子标题：{{ title }}
      
      当前内容/回答：
      {{ current_answer }}
      
      重写指令：{{ instruction }}

      {% if outline is defined and outline and outline != '[]' %}
      当前文章关联的大纲：
      {{ outline }}

      请在执行重写指令时保持该大纲的章节顺序和关键论据。
      {% endif %}
      
      请根据指令重写或润色整篇回答，直接输出处理后的完整内容。
