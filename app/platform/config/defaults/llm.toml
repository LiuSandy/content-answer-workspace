[llm.default]
provider = "deepseek"
model = "deepseek-v4-pro"

[llm.providers.deepseek]
base_url = "https://api.deepseek.com"
default_model = "deepseek-v4-pro"
timeout_seconds = 60.0

[llm.providers.kimi]
base_url = "https://api.moonshot.cn/v1"
default_model = "kimi-k2.5"
timeout_seconds = 60.0

[llm.providers.minimax]
base_url = "https://api.minimax.io/v1"
default_model = "MiniMax-M3"
timeout_seconds = 60.0

[llm.providers.glm]
base_url = "https://open.bigmodel.cn/api/paas/v4"
default_model = "glm-4-flash"
timeout_seconds = 60.0

# Auxiliary model services use the same non-secret configuration file.
[llm.services.embedding]
base_url = "https://ws-ft8ryk3ypnxfgzyc.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
model = "qwen3.7-text-embedding"

[llm.services.reranker]
base_url = "https://ws-ft8ryk3ypnxfgzyc.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
model = "qwen3-vl-rerank"

[llm.services.mineru]
base_url = "https://mineru.net/api/v4"
model = "vlm"
