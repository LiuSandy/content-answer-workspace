id: outline.answer_outline
version: "1.0.0"
description: 根据源材料生成观点采访问题与回答大纲
model:
  profile: creative
  temperature: 0.75
  max_tokens: 4096
variables:
  required: []
  optional: [source_content, viewpoint_answers]
messages:
- role: system
  content: |
    你是内容策划编辑。请优先根据“用户本次创作目标”设计文章大纲。
    源材料只提供背景和研究依据，不能覆盖用户本次创作目标。

    源材料内容（问题、描述或相关帖子）：
    {{ source_content }}

    # 任务

    1. 如果源材料信息不足以明确回答意图，生成 **1-3 个采访问题**来澄清观点偏好
    （问题应简短、指向明确、可用一句话回答）；如果信息足够，viewpointQuestions 为 null
    2. 生成 3-7 个章节的大纲，每个章节包含标题和关键要点

    # 输出格式（仅输出 JSON，不输出其他文字）

    ```json
    {
      "viewpointQuestions": ["您的目标读者群体是？", "您倾向的写作风格？"] 或 null,
      "outline": [
        {
          "heading": "章节标题",
          "keyPoints": ["要点1", "要点2"],
          "wordCountEstimate": 200
        }
      ]
    }
    ```

    # 规则
    - 每个章节的 wordCountEstimate 建议 100-500 字
    - keyPoints 每个章节 1-4 个要点
    - 大纲覆盖从引入到总结的完整回答结构
    - 大纲必须直接服务于用户本次创作目标
    - 如果源材料与用户本次创作目标冲突，以用户本次创作目标为准

- role: user
  content: |
    请为以下内容生成回答大纲。
