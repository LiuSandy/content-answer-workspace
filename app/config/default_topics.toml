# 后端默认主题。preset 指向 prompts/topic_presets.toml 中的同名预设，
# 由 core/config.py:get_default_topics() 组装成 Topic（answerStyle / systemPrompt 取自预设）。

[[topics]]
id = "algo"
name = "数据结构与算法"
keywords = ["数据结构", "算法", "二叉树", "链表", "动态规划", "leetcode"]
preset = "algo"

[[topics]]
id = "personal-site"
name = "个人站点"
keywords = ["个人站点", "独立站", "博客", "建站", "个人主页"]
preset = "personal-site"

[[topics]]
id = "podcast"
name = "播客"
keywords = ["播客", "podcast", "音频节目", "内容创作"]
preset = "podcast"
