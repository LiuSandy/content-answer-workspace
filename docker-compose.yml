services:
  postgres:
    image: paradedb/paradedb:latest
    container_name: content_workspace_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_workspace
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d content_workspace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


